<div class="header-content">
    <div class="spinning-cube">
        <a routerLink="/" aria-label="Home"
        (click)="closeSidePanel()">
            <div class="cube">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
        </a>
    </div>

    <nav id="main-navigation" aria-label="Main navigation" class="nav-links" [class.open]="isSidePanelOpen">
        <a routerLink="/" class="link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" (click)="closeSidePanel()">Home</a>
        <a routerLink="/about-me" class="link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" (click)="closeSidePanel()">About Me</a>
        <a routerLink="/projects" class="link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" (click)="closeSidePanel()">Projects</a>
        <button *ngIf="isSidePanelOpen" (click)="toggleSidePanel()" class="close-btn" aria-label="Close menu">×</button>
    </nav>

    <button (click)="toggleSidePanel()" class="hamburger-btn" aria-label="Toggle menu" aria-controls="main-navigation" [attr.aria-expanded]="isSidePanelOpen">
        <i class="bi bi-list"></i>
    </button>

    <div class="theme-switcher">
        <app-theme-switch></app-theme-switch>
    </div>
</div>

<div
  class="nav-overlay"
  *ngIf="isSidePanelOpen"
  (click)="closeSidePanel()"
></div>
